spring:
  application:
    name: hirehub
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hirehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

firebase:
  # Path to Firebase service account key JSON (place in src/main/resources/)
  # Example: classpath:firebase-service-account.json
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

rapidapi:
  key: ${RAPIDAPI_KEY:8f1e257b3amshe238377998bd8a9p1699ffjsn229836444dd8}
  host: ${RAPIDAPI_HOST:jsearch.p.rapidapi.com}

server:
  port: 8080
